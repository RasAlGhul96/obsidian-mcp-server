name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoria de seguridad (falla ante vulnerabilidades)
        run: npm audit --audit-level=low

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests de seguridad
        run: npm test
