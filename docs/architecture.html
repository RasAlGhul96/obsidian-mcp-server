<style>

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);

  header .sub { color: var(--muted); font-size: 13px; }

  svg { width: 100%; height: 100%; min-height: 640px; display: block; }

    fill: var(--panel); stroke: var(--n, var(--line)); stroke-width: 1.6;
    rx: 11; filter: drop-shadow(0 3px 8px rgba(0,0,0,.18));
    transition: opacity .18s ease;
  }
  .node .accentbar { fill: var(--n, var(--accent)); }
  .node .title { fill: var(--text); font-weight: 650; font-size: 13px; }
  .node .kind { fill: var(--muted); font-size: 10.5px; letter-spacing: .4px; text-transform: uppercase; }
  .node { cursor: pointer; transition: opacity .18s ease; }
  .node:hover rect { stroke-width: 2.4; }

  .edge { fill: none; stroke: var(--edge); stroke-width: 1.6; transition: opacity .18s ease, stroke .18s ease; }
  .edge.build { stroke-dasharray: 5 5; }
  .edgelabel { fill: var(--muted); font-size: 10px; opacity: 0; transition: opacity .18s; }

  /* highlight state */
  svg.has-active .node { opacity: var(--dim); }
  svg.has-active .edge { opacity: var(--dim); }
  svg.has-active .node.hi { opacity: 1; }
  svg.has-active .edge.hi { opacity: 1; stroke: var(--edge-hi); stroke-width: 2.4; }
  svg.has-active .edge.hi.build { stroke-dasharray: 5 5; }
  .node.hi rect { stroke-width: 2.6; }
  .edge.hi + .edgelabel, .edgelabel.hi { opacity: 1; }

  aside {
    width: 340px; flex: 0 0 340px; border-left: 1px solid var(--line);
    background: var(--panel); overflow-y: auto; padding: 18px;
  }
  @media (max-width: 860px) { aside { width: 100%; flex-basis: auto; border-left: none; border-top: 1px solid var(--line); } }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 4px 0 12px; }
  .flow {
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
    cursor: pointer; background: var(--panel-2); transition: border-color .15s, transform .05s;
  }
  .flow:hover { border-color: var(--accent); }
  .flow.active { border-color: var(--edge-hi); box-shadow: var(--shadow); }
  .flow .name { font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .flow .name .swatch { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .flow .desc { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .steps { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; display: none; }
  .flow.active .steps { display: block; }
  .step { display: flex; gap: 10px; padding: 5px 0; align-items: flex-start; }
  .step .num {
    flex: 0 0 20px; height: 20px; border-radius: 50%; background: var(--edge-hi); color: #fff;
    font-size: 11px; font-weight: 700; display: grid; place-items: center; margin-top: 1px;
  }
  .step .txt { font-size: 12.5px; }
  .step .txt b { color: var(--text); }
  .step .txt span { color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }

  #tooltip {
    position: fixed; z-index: 20; pointer-events: none; max-width: 300px;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow);
    font-size: 12.5px; opacity: 0; transition: opacity .12s; transform: translateY(-4px);
  }
  #tooltip.show { opacity: 1; }
  #tooltip .tt-title { font-weight: 700; margin-bottom: 3px; }
  #tooltip .tt-file { color: var(--accent); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; margin-bottom: 5px; }
  #tooltip .tt-desc { color: var(--muted); }
  .reset { font-size: 12px; color: var(--accent); cursor: pointer; background: none; border: none; padding: 0; margin-left: auto; }
</style>

      "id": "delete", "name": "delete_note (a papelera)",
      "description": "Mueve una nota a .trash (reversible). Requiere OBSIDIAN_ENABLE_WRITE.",
      "nodes": ["client", "transport", "sdk", "deleteNote", "guard", "trash", "fs", "helpers"],
      "edges": ["client>transport", "transport>sdk", "sdk>deleteNote", "deleteNote>guard", "guard>fs", "deleteNote>trash", "trash>fs", "deleteNote>helpers"],
      "steps": [
        { "node": "client", "action": "Solicita delete_note con { path }" },
        { "node": "sdk", "action": "Despacha al handler de delete_note" },
        { "node": "guard", "action": "resolveSafePath(path) — exige que exista y sea .md" },
        { "node": "trash", "action": "moveToTrash: rename a .trash/<nombre> (evita colisiones)" },
        { "node": "helpers", "action": "textResult('Nota movida a la papelera')" }
      ]
    },
    {
      "id": "denial", "name": "Denegacion Zero Trust",
      "description": "Un input hostil (traversal, oculto, absoluto, symlink que escapa...) es bloqueado por el guardian, en lectura y en escritura.",
      "nodes": ["client", "transport", "sdk", "createNote", "guard", "helpers"],
      "edges": ["client>transport", "transport>sdk", "sdk>createNote", "createNote>guard", "createNote>helpers"],
      "steps": [
        { "node": "client", "action": "Solicita p. ej. create_note con path malicioso (../../evil.md)" },
        { "node": "sdk", "action": "Despacha al handler" },
        { "node": "guard", "action": "resolveSafeWritePath() LANZA PathSecurityError (PATH_ESCAPE/HIDDEN_SEGMENT/...)" },
        { "node": "helpers", "action": "toErrorResult() -> { isError: true, 'Acceso denegado [CODIGO]' }" }
      ]
    }
  ]
};

const TYPE_COLORS = {
  external: "--external", transport: "--transport", sdk: "--sdk",
  entrypoint: "--entrypoint", config: "--config", tool: "--tool",
  write: "--write", util: "--util", security: "--security"
};
const TYPE_LABEL = {
  external: "Externo", transport: "Transporte", sdk: "SDK",
  entrypoint: "Entrypoint", config: "Config", tool: "Lectura",
  write: "Escritura", util: "Utilidad", security: "Seguridad"
};

const NW = 160, NH = 52, HW = NW/2, HH = NH/2;
const nodeById = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const edgeKey = e => e.from + ">" + e.to;

const SVGNS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

function border(node, tx, ty) {
  const dx = tx - node.position.x, dy = ty - node.position.y;
  if (dx === 0 && dy === 0) return { x: node.position.x, y: node.position.y };
  const sx = dx !== 0 ? HW / Math.abs(dx) : Infinity;
  const sy = dy !== 0 ? HH / Math.abs(dy) : Infinity;
  const s = Math.min(sx, sy);
  return { x: node.position.x + dx * s, y: node.position.y + dy * s };
}

const gEdges = document.getElementById("gEdges");
const gLabels = document.getElementById("gLabels");
const gNodes = document.getElementById("gNodes");
const svg = document.getElementById("svg");

const edgeEls = {};
for (const e of DATA.edges) {
  const a = nodeById[e.from], b = nodeById[e.to];
  const p1 = border(a, b.position.x, b.position.y);
  const p2 = border(b, a.position.x, a.position.y);
  const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
  const path = el("path", {
    d: `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`,
    class: "edge " + (e.kind || "runtime"),
    "marker-end": "url(#arrow)"
  });
  path.dataset.key = edgeKey(e);
  gEdges.appendChild(path);
  const lbl = el("text", { x: mx, y: my - 3, "text-anchor": "middle", class: "edgelabel" });
  lbl.textContent = e.label || "";
  lbl.dataset.key = edgeKey(e);
  gLabels.appendChild(lbl);
  edgeEls[edgeKey(e)] = { path, lbl };
}

const nodeEls = {};
for (const n of DATA.nodes) {
  const cvar = TYPE_COLORS[n.type] || "--accent";
  const g = el("g", { class: "node", transform: `translate(${n.position.x - HW}, ${n.position.y - HH})`, style: `--n: var(${cvar})` });
  g.appendChild(el("rect", { x: 0, y: 0, width: NW, height: NH, rx: 11 }));
  g.appendChild(el("rect", { class: "accentbar", x: 0, y: 0, width: 5, height: NH, rx: 2.5 }));
  const kind = el("text", { class: "kind", x: 16, y: 20 }); kind.textContent = TYPE_LABEL[n.type] || n.type;
  const title = el("text", { class: "title", x: 16, y: 37 }); title.textContent = n.label;
  g.appendChild(kind); g.appendChild(title);
  g.dataset.id = n.id;
  gNodes.appendChild(g);
  nodeEls[n.id] = g;

  g.addEventListener("mouseenter", ev => showTip(ev, n));
  g.addEventListener("mousemove", moveTip);
  g.addEventListener("mouseleave", hideTip);
}

const tip = document.getElementById("tooltip");
function showTip(ev, n) {
  tip.innerHTML = `<div class="tt-title">${n.label}</div>` +
    (n.file ? `<div class="tt-file">${n.file}</div>` : `<div class="tt-file">${TYPE_LABEL[n.type] || n.type}</div>`) +
    `<div class="tt-desc">${n.description || ""}</div>`;
  tip.classList.add("show"); moveTip(ev);
}
function moveTip(ev) {
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth) x = ev.clientX - w - pad;
  if (y + h > innerHeight) y = ev.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.classList.remove("show"); }

const legend = document.getElementById("legend");
for (const t in TYPE_LABEL) {
  const s = document.createElement("span");
  s.innerHTML = `<i class="dot" style="background:var(${TYPE_COLORS[t]})"></i>${TYPE_LABEL[t]}`;
  legend.appendChild(s);
}

const flowsBox = document.getElementById("flows");
const resetBtn = document.getElementById("reset");
let active = null;

DATA.flows.forEach(f => {
  const card = document.createElement("div");
  card.className = "flow"; card.dataset.id = f.id;
  const steps = f.steps.map((s, i) =>
    `<div class="step"><div class="num">${i + 1}</div><div class="txt"><b>${nodeById[s.node].label}</b> <span>— ${s.action}</span></div></div>`
  ).join("");
  card.innerHTML =
    `<div class="name"><span class="swatch"></span>${f.name}</div>` +
    `<div class="desc">${f.description}</div>` +
    `<div class="steps">${steps}</div>`;
  card.addEventListener("click", () => toggle(f, card));
  flowsBox.appendChild(card);
});

function clearHi() {
  svg.classList.remove("has-active");
  Object.values(nodeEls).forEach(g => g.classList.remove("hi"));
  Object.values(edgeEls).forEach(o => { o.path.classList.remove("hi"); o.path.setAttribute("marker-end", "url(#arrow)"); o.lbl.classList.remove("hi"); });
  document.querySelectorAll(".flow.active").forEach(c => c.classList.remove("active"));
  resetBtn.hidden = true; active = null;
}

function toggle(f, card) {
  if (active === f.id) { clearHi(); return; }
  clearHi();
  active = f.id; card.classList.add("active");
  svg.classList.add("has-active"); resetBtn.hidden = false;
  f.nodes.forEach(id => nodeEls[id] && nodeEls[id].classList.add("hi"));
  f.edges.forEach(k => {
    const o = edgeEls[k];
    if (o) { o.path.classList.add("hi"); o.path.setAttribute("marker-end", "url(#arrowhi)"); o.lbl.classList.add("hi"); }
  });
  card.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
resetBtn.addEventListener("click", clearHi);
</script>
</body>
</html>
